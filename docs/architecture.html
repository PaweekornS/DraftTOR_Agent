<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DraftTOR Agent · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · DraftTOR Agent</p>
    <h1>Draft, verify, revise — then hand to the editor</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">DraftTOR Agent architecture</title>
        <desc id="architecture-desc">The TOR agent drafts chapters from the orchestrator's template, verifies them against the regulation corpus and the Jev decision model, which returns violation probabilities, revises failing chapters, and hands a structured document to the web editor, which re-checks edits, exports the .docx and logs user actions to an audit log.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zone: TOR agent (app/tor) -->
        <rect x="212" y="176" width="400" height="224" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="368" y="180" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="412" y="189" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">TOR AGENT · APP/TOR</text>

        <!-- ============ Arrows (behind nodes) ============ -->
        <!-- 1. Orchestrator → Draft -->
        <line x1="176" y1="240" x2="232" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- 2. Draft → Verify (primary) -->
        <line x1="368" y1="240" x2="448" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 3. Corpus → Draft (context) -->
        <path d="M 320,56 H 308 Q 300,56 300,64 V 208"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- 4. Corpus → Verify (citations) -->
        <path d="M 480,56 H 488 Q 496,56 496,64 V 208"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 5. Verify → Jev (request) -->
        <path d="M 532,208 V 64 Q 532,56 540,56 H 660"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- 5b. Jev → Verify (response: violation probabilities) -->
        <path d="M 692,88 V 144 Q 692,152 684,152 H 576 Q 568,152 568,160 V 208"
              fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <!-- 6. Verify → Revise (blocking findings) -->
        <line x1="496" y1="272" x2="496" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 7. Revise → Verify (redraft) -->
        <line x1="544" y1="320" x2="544" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 8. Verify → Web editor -->
        <line x1="592" y1="224" x2="664" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 9. Web editor → Verify (re-check on edit) -->
        <line x1="664" y1="256" x2="592" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 10. Web editor → Export -->
        <line x1="740" y1="272" x2="740" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 11. Web editor → Audit (edits, acknowledgements) -->
        <path d="M 816,240 H 900 Q 908,240 908,248 V 320"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- ============ Arrow labels (masked, offset from strokes) ============ -->
        <rect x="180" y="222" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="231" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQUEST</text>

        <rect x="380" y="222" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="408" y="231" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHAPTERS</text>

        <rect x="306" y="120" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="332" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONTEXT</text>

        <rect x="426" y="120" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="458" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CITATIONS</text>

        <rect x="538" y="100" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="562" y="109" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DECIDE</text>

        <rect x="596" y="134" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="634" y="143" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">P(VIOLATION)</text>

        <rect x="458" y="290" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="474" y="299" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAIL</text>

        <rect x="550" y="290" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="576" y="299" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REDRAFT</text>

        <rect x="600" y="206" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="628" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON VIEW</text>

        <rect x="600" y="262" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="628" y="271" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECHECK</text>

        <rect x="690" y="290" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="712" y="299" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXPORT</text>

        <rect x="914" y="276" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="950" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER ACTIONS</text>

        <!-- ============ Nodes ============ -->
        <!-- Super-orchestrator (upstream / external) -->
        <rect x="40" y="208" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="208" width="136" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="216" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="60" y="225" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UP</text>
        <text x="108" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Super-orchestrator</text>
        <text x="108" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">template + request</text>

        <!-- Regulation corpus (store) -->
        <rect x="320" y="24" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="24" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="328" y="32" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="340" y="41" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="400" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Regulation corpus</text>
        <text x="400" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ocr_docs · 1,336 clauses</text>

        <!-- Jev decision model (external) -->
        <rect x="660" y="24" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="24" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="668" y="32" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="682" y="41" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="740" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Jev decision model</text>
        <text x="740" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">typesafe/jev-1.13</text>

        <!-- Draft chapters (backend) -->
        <rect x="232" y="208" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="208" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="240" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="254" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
        <text x="300" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Draft chapters</text>
        <text x="300" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parallel · 4 workers</text>

        <!-- Verify (focal) -->
        <rect x="448" y="208" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="448" y="208" width="144" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="456" y="216" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="472" y="225" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="520" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify</text>
        <text x="520" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rules · facts · Jev</text>

        <!-- Revise (backend) -->
        <rect x="448" y="320" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="448" y="320" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="456" y="328" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="472" y="337" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
        <text x="520" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Revise</text>
        <text x="520" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">failing chapters · ≤2</text>

        <!-- Web editor (user) -->
        <rect x="664" y="208" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="664" y="208" width="152" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="672" y="216" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="684" y="225" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="740" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web editor</text>
        <text x="740" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TORDocumentView</text>

        <!-- Export .docx (backend) -->
        <rect x="664" y="320" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="664" y="320" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="672" y="328" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="688" y="337" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOCX</text>
        <text x="740" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Export .docx</text>
        <text x="740" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">export_gate · draft stamp</text>

        <!-- Audit log (store) -->
        <rect x="848" y="320" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="320" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="856" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="870" y="337" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
        <text x="908" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Audit log</text>
        <text x="908" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">append-only</text>

        <!-- ============ Legend strip ============ -->
        <line x1="40" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="452" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Compliance gate</text>
        <rect x="164" y="452" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="184" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Pipeline step</text>
        <rect x="276" y="452" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="296" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>
        <rect x="352" y="452" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="372" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External / user</text>
        <line x1="484" y1="458" x2="512" y2="458" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      </svg>
    </div>
  </div>
</body>
</html>
